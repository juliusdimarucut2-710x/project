<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Activity 4</title>
  
  <style>
  
  body
  {
    font-family: Times New Roman;
  }
  </style>
</head>
<body>
  <h1><font color="Orange">
    How can we help?
  </font>
  </h1>
  
  <fieldset>
    <legend><font color="Indigo">Request for proposal</font></legend>
    <table>
      <form>
      <tr>
        <td><label>Your name:</label></td>
        <td><input type="text" size="15" placeholder="First Name"></td>
      </tr>
      <tr>
        <td><label>Email:</label></td>
        <td><input type="text" size="15" placeholder="First Name"></td>
      </tr>
      <tr>
        <td><label>Username:</label></td>
        <td><input type="text" size="15" placeholder="First Name"></td>
      </tr>
      <tr>
        <td><label>Password:</label></td>
        <td><input type="text" size="15" placeholder="First Name"></td>
      </tr>
      <tr>
        <td><label>Comments:</label></td>
        <td><textarea placeholder="Briefly describe your business in this space."></textarea></td>
      </tr>
        
      
        <tr>
           <td>Company size:</td>
           <td><input type="radio" name="company size" value="Less than 10"><label>Less than 10</label></td>
        </tr>
        <tr>
          <td width="75"></td>
          <td><input type="radio" name="company size" value="11 to 50"><label>11 to 50</label></td>
        </tr>
        <tr>
          <td width="75"></td>
          <td><input type="radio" name="company size" value="50 to 200"><label>50 to 200</label></td>
        </tr>
        <tr>
          <td width="75"></td>
          <td><input type="radio" name="company size" value="Over 200"><label>Over 200</label></td>
        </tr>
        <tr>
          <td>Service:</td>
          <td><input type="checkbox" name="Brand Identity" value="Brand Identity"><label>Brand Identity</label></td>
          <td><input type="checkbox" name="New Website" value="New Website"><label>New Website</label></td>
          <td><input type="checkbox" name="Web Redisigner" value="Web Redisigner"><label>Web Redisigner</label></td>
        </tr>
        <tr>
          <td>Timeline:</td>
          <td><select>
            <optgroup label="Time line data:">
                
                <option>Immediate</option>
                <option>1-2 weeks</option>
                <option>3-6 weeks</option>
                <option>7-2 months</option>
            </optgroup></td>
        </tr>
          
          <tr>
            <td width="75"></td>
            <td><button type="submit">Send to dev/design</button></td>
          </tr>
 
        </form>
    </table>
  </fieldset>
</body>
</html>
